<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        background-color: #eb3e3e;
        height: 100px;
        width: 100px;
        display: inline-block;
        visibility: hidden;
      }
      span {
        background-color: #51ef61;
        height: 100px;
        width: 100px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <!-- 
        display  =  property that defines if/how and
                    element is displayed
         display :none -> make elemnt complety earase
         visiblity :hidden -> makes content not visible but it takes the space as it is. 

        Block Level =  start at a new line ,take up the full width avaiable
                            (h1,div,p,form,header,footer)

        
        inline =   do not start on a new line,width is limited to what is needed
                        (span, a ,img)
 -->

    <div>div</div>
    <span>span</span>
