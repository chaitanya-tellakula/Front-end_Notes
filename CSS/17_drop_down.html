<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .dropdown {
        display: inline-block;
      }
      .dropdown button {
        background-color: #b1aeae;
        color: white;
        padding: 5px 15px;
        border: none;
        cursor: pointer;
      }

      .dropdown a {
        display: block;
        color: black;
        text-decoration: none;
        padding: 10px 15px;
      }
      .dropdown .content {
        position: absolute;
        background-color: #d7d5d5;
        min-width: 100px;
        box-shadow: 2px 2px 5px black;
        display: none;
      }

      .dropdown:hover .content {
        display: block;
      }

      .dropdown:hover button {
        background-color: #767676;
      }

      .dropdown a:hover {
        background-color: #8fd7dd;
      }
    </style>
  </head>
  <body>
    <div class="dropdown">
      <button>Food</button>
      <div class="content">
        <a href="">Apple</a>
        <a href="">Banana</a>
        <a href="">Orange</a>
      </div>
    </div>

    <p>
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Architecto rerum
      tenetur deleniti adipisci pariatur modi repellat quam possimus? Nulla
      quaerat reprehenderit aspernatur labore minus repellendus sed architecto
      temporibus esse culpa.
    </p>
  </body>
</html>
