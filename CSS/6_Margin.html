<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
      }
      .box {
        width: 250px;
        height: 250px;
        font-size: 5em;
        border: 5px solid black;
      }

      #box1 {
        background-color: #51ba0b;
        margin-left: auto;
      }
      #box2 {
        background-color: #3c58e3;
        margin-right: auto;
      }
      #box3 {
        background-color: #e4aa2d;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <!-- margins =space around an element -->
    <!-- margin-left=auto => makes box stay on the right side of page always
    margin-right=auto => makes box stay on the left side of page always
    margin=auto => makes element stay on the middle of the page always -->

    <div class="box" id="box1">Box1</div>
    <div class="box" id="box2">Box2</div>
    <div class="box" id="box3">Box3</div>
  </body>
</html>
