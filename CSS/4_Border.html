<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Border</title>

    <style>
      h1 {
        border-style: dotted;
        border-width: 3px;
        color: black;
        border-radius: 20px;
      }

      p {
        border-bottom: 3px solid red;
        border-top: 3px solid yellow;
        border-left: 3px dashed orange;
        border-right: 3px dashed green;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>Bro Code</h1>

    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsa accusantium
      dolorem eius accusamus numquam error obcaecati, veniam, corrupti
      reiciendis quidem autem necessitatibus facere cupiditate minus, pariatur
      eaque porro dicta? Recusandae!
    </p>
  </body>
</html>
