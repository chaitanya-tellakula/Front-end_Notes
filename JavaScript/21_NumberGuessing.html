<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // isNaN(guess)) -> checks if user entered string
      //                   when string converted into number
      //                   it becomes Nan so to verify it is used

      const min = 1;
      const max = 100;
      const answer = Math.floor(Math.random() * (max - min + 1)) + min;

      let attempts = 0;
      let guess;
      let running = true;

      while (running) {
        guess = window.prompt("Enter a number between " + min + " - " + max);
        guess = Number(guess);

        if (isNaN(guess)) {
          window.alert("plz enter a valid number");
        } else if (guess < min || guess > max) {
          window.alert("plz enter a valid number");
        } else {
          attempts++;
          if (guess < answer) {
            window.alert("TOO LOW ! Try Again");
          } else if (guess > answer) {
            window.alert("TOO HIGH ! Try Again");
          } else {
            window.alert(
              "CORRECT ! The answer is : " +
                answer +
                " It Took You " +
                attempts +
                " Attempts",
            );
            running = false;
          }
        }
      }
    </script>
  </body>
</html>
