<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #myButton {
        font-size: 2em;
        margin: 10px;
        border: none;
        border-radius: 5px;
        padding: 10px 15px;
      }

      .myButtons {
        font-size: 2em;
        margin: 10px;
        border: none;
        border-radius: 5px;
        padding: 10px 15px;
        display: block;
      }

      .enabled {
        background-color: #34b8dc;
        color: white;
      }

      .hover {
        background-color: #1696ba;
        font-weight: bold;
        /* font-weight: bold;  Bold take some more space as
         size increases so i when i hover it 
         shows size has increased feeling*/
      }

      .disabled {
        /* replace names  of enabled with disabled */

        background-color: rgb(87, 86, 86);
        color: rgb(89, 244, 151);
      }
    </style>
  </head>
  <body>
    <h1 id="myH1">Hello</h1>
    <button id="myButton">My Button</button>
    <br /><br />

    <button class="myButtons">Button 1</button>
    <button class="myButtons">Button 2</button>
    <button class="myButtons">Button 3</button>
    <button class="myButtons">Button 4</button>
    <button class="myButtons">Button 5</button>
    <script src="67_ClassLists.js"></script>
  </body>
</html>
