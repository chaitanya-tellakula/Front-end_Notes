<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #fff;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .weatherForm {
        margin: 20px;
      }

      .cityInput {
        padding: 10px;
        width: 300px;
        font-size: 1.5em;
        font-weight: bold;
        border-radius: 10px;
        border: 2px solid hsl(0, 0%, 95%);
      }

      button[type="submit"] {
        padding: 10px 20px;
        font-weight: bold;
        font-size: 1.5rem;
        background-color: #3feaa3;
        color: white;
        cursor: pointer;
        border-radius: 10px;
      }
      .card {
        background: linear-gradient(
          200deg,
          rgb(52, 194, 237),
          rgb(249, 134, 34)
        );
        min-width: 300px;
        padding: 50px;
        display: flex;
        align-items: center;
        flex-direction: column;
        box-shadow: 2px 2px 10px black;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 20px;
      }

      p {
        font-size: 1.5em;
        margin: 0;
        margin-bottom: 10px;
      }

      .cityDisplay,
      .tempDisplay {
        font-size: 2.5em;
        font-weight: bold;
        color: hsl(0, 0%, 10%);
      }

      .humidityDisplay {
        font-weight: bold;
        margin-bottom: 15px;
      }

      .descDisplay {
        font-style: italic;
        font-weight: bold;
        font-size: 1.5em;
      }

      .weatherEmoji {
        margin: 0;
        font-size: 7.5rem;
      }

      .errorDisplay {
        font-size: 1.5em;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <form class="weatherForm">
      <input type="text" class="cityInput" placeholder="Enter City" id="name" />
      <button type="submit">Get Weather</button>
    </form>

    <div class="card" style="display: none"></div>
    <script src="75_Weather_App.js"></script>
  </body>
</html>
