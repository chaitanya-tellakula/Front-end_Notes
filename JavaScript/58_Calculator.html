<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #calculator {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #201f1f;
        border-radius: 15px;
        max-width: 500px;
        overflow: hidden;
      }
      #display {
        width: 100%;
        padding: 20px;
        font-size: 3em;
        text-align: left;
        border: none;
        background-color: #484848;
        color: white;
      }
      button {
        width: 100px;
        height: 100px;
        border-radius: 50px;
        border: none;
        background-color: hsl(0, 1%, 36%);
        color: white;
        font-size: 2em;
        cursor: pointer;
      }

      button:hover {
        background-color: hsl(0, 1%, 46%);
      }
      button:active {
        background-color: hsl(0, 1%, 56%);
      }
      .operator-btn {
        background-color: hsl(38, 85%, 48%);
      }
      .operator-btn:hover {
        background-color: hsl(38, 85%, 58%);
      }
      .operator-btn:active {
        background-color: hsl(38, 85%, 68%);
      }

      #keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 25px;
      }
    </style>
  </head>
  <body>
    <div id="calculator">
      <input id="display" readonly />
      <div id="keys">
        <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('*')" class="operator-btn">*</button>
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="appendToDisplay('/')" class="operator-btn">/</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="calculate()">=</button>
        <button onclick="clearDisplay()" class="operator-btn">C</button>
      </div>
    </div>

    <script>
      // eval() =Converts a string into JavaScript code and executes it.

      //   let age = 20;
      //   eval("age = 25");
      //   console.log(age);
      const display = document.getElementById("display");

      function appendToDisplay(input) {
        display.value += input;
      }

      function clearDisplay() {
        display.value = "";
      }
      function calculate() {
        try {
          display.value = eval(display.value);
        } catch (error) {
          display.value = "ERROR";
        }
      }
    </script>
  </body>
</html>
