<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- when i write the "for" this should match the "input id" then now i touch the text in the label autoatically cusor goes to the input in the label -->

    <form action="index.php" method="POST" enctype="multipart/form-data">
      <label for="username">username:</label>
      <input
        type="text"
        id="username"
        minlength="6"
        maxlength="15"
        required
        placeholder="SongeBob"
      /><br />
      <br />
      <label for="password">password :</label>
      <input
        type="password"
        id="password"
        minlength="6"
        maxlength="15"
        required
      /><br /><br />

      <label for="email">Email :</label>
      <input type="email" id="email" placeholder="demo@gmail.com" /><br /><br />

      <label for="phoneno">Phone no :</label>
      <input
        type="tel"
        id="phoneno"
        placeholder="123-456-789"
        pattern="[0-9]{3}-[0-3]{3}-[0-9]{3}"
      />
      <br /><br />

      <label for="bday">Birthday :</label>
      <input type="date" id="bday" /> <br /><br />

      <label for="quantity">Quantity :</label>
      <input type="number" id="quantity" min="0" max="100" value="7" />
      <br /><br />

      <label for="title">Title :</label><br />

      <label for="Mr."> Mr.</label>
      <input type="radio" name="title" id="Mr." />
      <label for="Mrs."> Mrs.</label>
      <input type="radio" name="title" id="Mrs." />
      <label for="PhD."> PhD.</label>
      <input type="radio" name="title" id="PhD." /><br /><br />

      <label for="payment">payment :</label>
      <select id="payment">
        <option value="visa">visa</option>
        <option value="mastercard">mastercard</option>
        <option value="giftcard">giftcard</option></select
      ><br /><br />
      <label for="subscribe">subscribe :</label>
      <input type="checkbox" id="subscribe" /><br /><br />

      <label for="comment">Comment :</label><br />
      <textarea id="comment" rows="3" cols="25"></textarea> <br /><br />

      <label for="file">File :</label>
      <input type="file" id="file" accept="image/png.image/jpeg" /><br /><br />

      <input type="reset" />
      <input type="submit" />
    </form>
  </body>
</html>
